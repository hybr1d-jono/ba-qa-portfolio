<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClinicBill Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    td, th { border-bottom: 1px solid #ddd; padding: 0.4rem; text-align: left; }
    .toast { position: fixed; top: 1rem; right: 1rem; background: #1e7a3a; color: #fff; padding: 0.6rem 1rem; border-radius: 6px; }
    fieldset { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>ClinicBill Demo: Invoice</h1>
  <p>A small fictional billing app, built only so the tests in this repo have something real to run against.</p>

  <fieldset>
    <legend>Tax settings</legend>
    <label>Tax rate (%) <input data-testid="tax-rate" type="number" value="6" step="0.01"></label>
    <label>Tax cap ($, blank for none) <input data-testid="tax-cap" type="number" step="0.01"></label>
  </fieldset>

  <fieldset>
    <legend>Add a line</legend>
    <label>Description <input data-testid="line-description"></label>
    <label>Qty <input data-testid="line-qty" type="number" value="1"></label>
    <label>Unit price <input data-testid="line-price" type="number" step="0.01"></label>
    <button data-testid="add-line">Add line</button>
  </fieldset>

  <table>
    <thead><tr><th>Item</th><th>Qty</th><th>Net</th><th>Tax</th></tr></thead>
    <tbody data-testid="invoice-lines"></tbody>
  </table>

  <p>Subtotal: <span data-testid="subtotal">0.00</span></p>
  <p>Tax adjustment: <span data-testid="tax-adjustment">0.00</span></p>
  <p>Total tax: <span data-testid="total-tax">0.00</span></p>
  <p>Invoice total: <span data-testid="invoice-total">0.00</span></p>

  <button data-testid="save-invoice">Save invoice</button>

  <script type="module">
    import { calculateInvoice } from './tax.js';

    const lines = [];
    const $ = (id) => document.querySelector(`[data-testid="${id}"]`);

    function render() {
      const cap = $('tax-cap').value === '' ? null : Number($('tax-cap').value);
      const result = calculateInvoice(lines, { ratePercent: Number($('tax-rate').value), cap });
      $('invoice-lines').innerHTML = result.lines.map((l) =>
        `<tr data-testid="invoice-line"><td>${l.description}</td><td>${l.qty}</td><td>${l.net.toFixed(2)}</td><td>${l.tax.toFixed(2)}</td></tr>`
      ).join('');
      $('subtotal').textContent = result.subtotal.toFixed(2);
      $('tax-adjustment').textContent = result.adjustment.toFixed(2);
      $('total-tax').textContent = result.totalTax.toFixed(2);
      $('invoice-total').textContent = result.total.toFixed(2);
    }

    $('add-line').addEventListener('click', () => {
      lines.push({
        description: $('line-description').value,
        qty: Number($('line-qty').value),
        unitPrice: Number($('line-price').value),
      });
      render();
    });
    $('tax-rate').addEventListener('input', render);
    $('tax-cap').addEventListener('input', render);

    // Saving is deliberately slow (1.5s), like a real backend call.
    // A test that waits only 1 second for the toast will fail. See docs/mr-writeups.md.
    $('save-invoice').addEventListener('click', () => {
      setTimeout(() => {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.setAttribute('role', 'status');
        toast.setAttribute('data-testid', 'toast-success');
        toast.textContent = 'Invoice saved';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
      }, 1500);
    });

    render();
  </script>
</body>
</html>
